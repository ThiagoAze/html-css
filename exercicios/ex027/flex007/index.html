<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            display: flex;
            background-color: lightsalmon;
            flex-flow: row wrap;
        }
        div.item{
            padding: 20px;
            background-color: lightblue;
            border: 1px solid;
            text-align: center;
            
        }
        #i1{
            order: 1;
        }
        #i2{
            order: 0;
        }
        #i3{
            order: -4;
        }
        #i4{
            order: 4;
        }
        #i5{
            order: 7;
        }
        #i6{
            order: 6;
        }
        #i7{
            order: 5;
        }
    </style>
</head>
<body>
    <div class="container"> <!-- exemplo padrão -->
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
    
    <hr>
    
    <div class="container"> <!-- exemplo com order -->
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
