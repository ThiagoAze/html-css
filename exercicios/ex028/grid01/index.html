<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        .container{
            display: grid; /* definindo uma grade... */
            grid-template-columns: auto auto auto; /* com 3 colunas... */
            grid-template-rows: auto auto auto; /* e 3 linhas */
            gap: 5px; /* espacamento entre linhas e colunas */
            height: 250px;

            border: 3px solid blue;
        }
        .item{
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
