<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        .container{
            display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, auto); /* simplificado grid-template-rows e grid-template-columns respectivamente */
            place-items: start center; /* simplificado align-items e justify-items respectivamente */
            place-content: space-between end; /* simplificado align-content e justify-content respectivamente */
            gap: 5px; /* espacamento entre linhas e colunas */
            /* height: 250px; */

            border: 3px solid blue;
        }
        .item{
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
